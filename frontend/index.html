<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EV-Bygg-konsult</title>
    <meta
      name="description"
      content="EV-Bygg-konsult är ett byggkonsultföretag i Stockholmsregionen som erbjuder nybyggnation, om- och tillbyggnad, renovering och projektledning."
    />
  </head>
  <body>
    <!-- Static copies so Netlify detects the forms at deploy. Field names must match the React forms. -->
    <form name="kontakt" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="name" /><input name="email" /><input name="phone" />
      <textarea name="message"></textarea><input name="consent" /><input name="source" />
    </form>
    <form name="bokning" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="name" /><input name="phone" /><input name="email" />
      <input name="preferredDate" /><input name="projectType" />
      <textarea name="message"></textarea><input name="consent" /><input name="source" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
